name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and run unit tests
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - name: Native process integration
        shell: pwsh
        run: |
          node --test tests/transport.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native integration tests failed.' }
      - name: Installer dry run
        shell: pwsh
        run: |
          ./scripts/install.ps1 -EnableAutomation -WhatIf
          ./scripts/uninstall.ps1 -WhatIf
      - name: Build private alpha archive
        shell: pwsh
        run: |
          ./scripts/package.ps1
          ./scripts/build-setup.ps1
          ./build/SecretIME.SetupTests.exe ./dist/SecretIME-0.1.0-alpha.3-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Embedded setup payload tests failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SecretIME-private-alpha-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*-Setup.exe
          retention-days: 7
